[workspace]
members = [
    "adapters/workbuddy",
    "crates/etw-collector",
    "crates/evidence-correlator",
    "crates/capability-audit",
    "crates/gui-host",
    "crates/observer-service",
    "crates/product-config",
    "crates/desktop-shell",
    "crates/native-contracts",
    "tests/fixtures/workbuddy-process",
]
resolver = "2"

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
ferrisetw = "=1.2.0"
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["fs"] }
windows-service = "=0.8.1"
windows = { version = "=0.57.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
] }
